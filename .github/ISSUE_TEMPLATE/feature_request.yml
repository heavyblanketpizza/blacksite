name: Feature request
description: Something Blacksite should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do during an investigation and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The change you have in mind, if any, and how you would tell it works.
