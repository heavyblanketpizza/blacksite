vllm:
  # Use the OpenAI-compatible API, not LiteLLM's in-process vLLM provider.
  model: openai/holmes-local
  api_base: "{{ env.VLLM_API_BASE }}"
  api_key: "{{ env.VLLM_API_KEY }}"
  # Qwen3.8 thinking-mode sampling; top_k=20 comes from the model's
  # generation_config.json, which vLLM applies by default.
  temperature: 1.0
  top_p: 0.95
  # Thinking tokens count toward this limit.
  max_tokens: 16384
  custom_args:
    # Total input + output limit. Keep in sync with vLLM --max-model-len.
    # Numeric values must stay YAML numbers: env substitution produces strings.
    max_context_size: 131072
